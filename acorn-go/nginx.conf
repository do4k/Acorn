# Nginx reverse proxy for Acorn-Go WebSocket connections.
#
# This allows EO browser clients (e.g. EOWeb) to connect via:
#   ws://play.yourdomain.com/
#
# Install: copy to /etc/nginx/sites-available/acorn and symlink to sites-enabled.

upstream acorn_ws {
    server 127.0.0.1:8079;
}

upstream acorn_tcp {
    server 127.0.0.1:8078;
}

server {
    listen 80;
    server_name play.yourdomain.com;

    # WebSocket proxy
    location / {
        proxy_pass http://acorn_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # EO clients send small packets frequently; keep the connection alive.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Don't buffer WebSocket frames.
        proxy_buffering off;
    }
}

