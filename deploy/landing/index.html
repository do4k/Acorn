<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Acorn</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 0%, #1f2a1a, #0b0f0a 70%);
      color: #e6f0dc;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    main { max-width: 40rem; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 .5rem; letter-spacing: .02em; }
    p { color: #a9bd9b; line-height: 1.6; margin: 0 0 2rem; }
    a.button {
      display: inline-block;
      padding: .9rem 1.6rem;
      border-radius: .6rem;
      background: #7cc25a;
      color: #0b0f0a;
      font-weight: 600;
      text-decoration: none;
      transition: transform .15s ease, background .15s ease;
    }
    a.button:hover { transform: translateY(-2px); background: #8ed46a; }
    footer { margin-top: 3rem; font-size: .85rem; color: #6f8464; }
    footer a { color: #9fbf8b; }
  </style>
</head>
<body>
  <main>
    <h1>Project Acorn</h1>
    <p>A modern server emulator for Endless Online. Play in the browser, or connect with the native client.</p>
    <a class="button" href="https://game.acornhost.io">Play in your browser &rarr;</a>
    <footer>
      <a href="https://github.com/do4k/Acorn">Source on GitHub</a>
    </footer>
  </main>
</body>
</html>
