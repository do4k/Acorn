# Each database is a Compose profile that brings up a complete environment:
# its database, the game server and the REST API.
#
#   docker compose --profile mysql up
#   docker compose --profile sqlite up
#   docker compose --profile postgres up
#   docker compose --profile sqlserver up
#
# The Aspire dashboard has no profile, so it runs for every environment.
# `COMPOSE_PROFILES` in .env selects the environment used by a bare
# `docker compose up` (default: mysql).

x-acorn-server: &acorn-server
  build:
    context: .
    dockerfile: src/Acorn/Dockerfile
  ports:
    - "8078:8078"            # Game TCP (native clients + SLN)
    - "127.0.0.1:8079:8079"  # Game WebSocket, only reached via the Caddy proxy
  volumes:
    - ./src/Acorn/Data:/app/Data:ro
  restart: unless-stopped
  networks:
    acorn-network:
      aliases:
        - acorn-server

x-acorn-api: &acorn-api
  build:
    context: .
    dockerfile: src/Acorn.Api/Dockerfile
  ports:
    - "5000:8080"
  restart: unless-stopped
  networks:
    - acorn-network

services:
  # Aspire Dashboard (OpenTelemetry metrics/traces/logs UI) - runs for every profile
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: acorn-aspire
    ports:
      - "127.0.0.1:18888:18888"   # Web UI (local only; public access is via Caddy + basic auth)
      - "127.0.0.1:4317:18889"    # OTLP gRPC receiver (local only)
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
    restart: unless-stopped
    networks:
      - acorn-network

  # Caddy: TLS termination and reverse proxy (landing page + eoweb + wss).
  # Runs for every profile; talks to whichever server is on the acorn-server alias.
  caddy:
    image: caddy:2
    container_name: acorn-caddy
    entrypoint: ["/bin/sh", "/etc/caddy/entrypoint.sh"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN:-acornhost.io}
      - ASPIRE_ENABLED=${ASPIRE_ENABLED:-true}
      - ASPIRE_USER=${ASPIRE_USER:-acorn}
      - ASPIRE_PASSWORD_HASH=${ASPIRE_PASSWORD_HASH}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy/aspire.caddy:/etc/caddy/aspire.caddy:ro
      - ./deploy/caddy/entrypoint.sh:/etc/caddy/entrypoint.sh:ro
      - ./deploy/landing:/srv/landing:ro
      - ${EOWEB_DIST:-./deploy/eoweb}:/srv/eoweb:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      - acorn-network

  # ------------------------------------------------------------------
  # MySQL environment
  # ------------------------------------------------------------------
  mysql:
    image: mysql:9.1
    container_name: acorn-mysql-db
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - acorn-network
    profiles:
      - mysql

  acorn:
    <<: *acorn-server
    container_name: acorn
    environment:
      - Database__Engine=MySQL
      - Database__ConnectionString=Server=mysql;Port=3306;Database=acorn;User=acorn;Password=acornpassword
      - Cache__Enabled=${CACHE_ENABLED}
      - Server__Hosting__SLN__Enabled=${SERVER_SLN_ENABLED}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    depends_on:
      mysql:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    profiles:
      - mysql

  acorn-api:
    <<: *acorn-api
    container_name: acorn-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - Database__Engine=MySQL
      - Database__ConnectionString=Server=mysql;Port=3306;Database=acorn;User=acorn;Password=acornpassword
      - Cache__Enabled=${CACHE_ENABLED}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    depends_on:
      mysql:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    profiles:
      - mysql

  # ------------------------------------------------------------------
  # SQLite environment
  # ------------------------------------------------------------------
  acorn-sqlite:
    <<: *acorn-server
    container_name: acorn-sqlite
    volumes:
      - ./src/Acorn/Data:/app/Data:ro
      - ./data/sqlite:/app/mnt
    environment:
      - Database__Engine=SQLite
      - Database__ConnectionString=Data Source=/app/mnt/Acorn.db;
      - Cache__Enabled=${CACHE_ENABLED}
      - Server__Hosting__SLN__Enabled=${SERVER_SLN_ENABLED}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    depends_on:
      aspire-dashboard:
        condition: service_started
    profiles:
      - sqlite

  acorn-api-sqlite:
    <<: *acorn-api
    container_name: acorn-api-sqlite
    volumes:
      - ./data/sqlite:/app/mnt
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - Database__Engine=SQLite
      - Database__ConnectionString=Data Source=/app/mnt/Acorn.db;
      - Cache__Enabled=${CACHE_ENABLED}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    depends_on:
      aspire-dashboard:
        condition: service_started
    profiles:
      - sqlite

  # ------------------------------------------------------------------
  # PostgreSQL environment
  # ------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: acorn-postgres-db
    environment:
      - POSTGRES_DB=acorn
      - POSTGRES_USER=acorn
      - POSTGRES_PASSWORD=acornpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acorn -d acorn"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - acorn-network
    profiles:
      - postgres

  acorn-postgres:
    <<: *acorn-server
    container_name: acorn-postgres
    environment:
      - Database__Engine=PostgreSQL
      - Database__ConnectionString=Host=postgres;Port=5432;Database=acorn;Username=acorn;Password=acornpassword
      - Cache__Enabled=${CACHE_ENABLED}
      - Server__Hosting__SLN__Enabled=${SERVER_SLN_ENABLED}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    depends_on:
      postgres:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    profiles:
      - postgres

  acorn-api-postgres:
    <<: *acorn-api
    container_name: acorn-api-postgres
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - Database__Engine=PostgreSQL
      - Database__ConnectionString=Host=postgres;Port=5432;Database=acorn;Username=acorn;Password=acornpassword
      - Cache__Enabled=${CACHE_ENABLED}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    depends_on:
      postgres:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    profiles:
      - postgres

  # ------------------------------------------------------------------
  # SQL Server environment
  # ------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: acorn-sqlserver-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=AcornPassword123!
      - MSSQL_PID=Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P AcornPassword123! -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - acorn-network
    profiles:
      - sqlserver

  acorn-sqlserver:
    <<: *acorn-server
    container_name: acorn-sqlserver
    environment:
      - Database__Engine=SqlServer
      - Database__ConnectionString=Server=sqlserver;Database=acorn;User Id=sa;Password=AcornPassword123!;TrustServerCertificate=True
      - Cache__Enabled=${CACHE_ENABLED}
      - Server__Hosting__SLN__Enabled=${SERVER_SLN_ENABLED}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    depends_on:
      sqlserver:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    profiles:
      - sqlserver

  acorn-api-sqlserver:
    <<: *acorn-api
    container_name: acorn-api-sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - Database__Engine=SqlServer
      - Database__ConnectionString=Server=sqlserver;Database=acorn;User Id=sa;Password=AcornPassword123!;TrustServerCertificate=True
      - Cache__Enabled=${CACHE_ENABLED}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    depends_on:
      sqlserver:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    profiles:
      - sqlserver

volumes:
  postgres-data:
  mysql-data:
  sqlserver-data:
  caddy-data:
  caddy-config:

networks:
  acorn-network:
    driver: bridge
